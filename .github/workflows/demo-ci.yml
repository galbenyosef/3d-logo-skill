name: Demo CI

on:
  pull_request:
    paths:
      - 'demo/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install dependencies
        working-directory: demo
        run: npm ci

      - name: Type check
        working-directory: demo
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: demo
        run: npx vitest run

      - name: Build
        working-directory: demo
        run: npm run build
